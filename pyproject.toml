[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "certbot-dns-alias"
version = "0.1.0"
description = "Certbot DNS-01 plugin with CNAME delegation for Alibaba Cloud DNS and Tencent Cloud DNSPod"
readme = "README.pypi.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "tiyee", email = "tiyee@live.com"}]
keywords = ["certbot", "dns-01", "acme", "cname", "aliyun", "tencent", "dnspod"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "certbot>=3.0,<6",
    "dnspython>=2.6,<3",
    "alibabacloud-alidns20150109>=3.0,<5",
    "alibabacloud-tea-openapi>=0.3,<1",
    "alibabacloud-tea-util>=0.3,<1",
    "tencentcloud-sdk-python-dnspod>=3.1.130,<4",
]

[project.urls]
Homepage = "https://github.com/tiyee/certbot-dns-alias"
Repository = "https://github.com/tiyee/certbot-dns-alias"
Issues = "https://github.com/tiyee/certbot-dns-alias/issues"

[project.entry-points."certbot.plugins"]
dns-alias = "certbot_dns_alias.dns_alias:Authenticator"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "twine>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["certbot_dns_alias"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
include = ["/certbot_dns_alias", "/tests", "/examples", "/README.md", "/README.pypi.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
