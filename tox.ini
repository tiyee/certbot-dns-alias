[tox]
requires =
    tox>=4.28,<5
    tox-uv>=1.26,<2
env_list =
    py{39,310,311,312,313}-certbot3
    py{39,310,311,312,313,314}-certbot4
    py{310,311,312,313,314}-certbot5

[testenv]
description = run pytest against the installed wheel with {env_name}
runner = uv-venv-runner
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=8,<10
    certbot3: certbot==3.0.0
    certbot3: acme==3.0.0
    certbot3: pyopenssl>=24.3,<25
    certbot4: certbot>=4,<5
    certbot4: acme>=4,<5
    certbot5: certbot>=5,<6
    certbot5: acme>=5,<6
# Run outside the source directory so imports exercise the installed wheel.
change_dir = {env_tmp_dir}
commands_pre =
    certbot3: python -c "from certbot_dns_alias.compat import metadata; assert metadata.version('certbot') == '3.0.0'; assert metadata.version('acme') == '3.0.0'; print('Host Certbot:', metadata.version('certbot'))"
    certbot4: python -c "from certbot_dns_alias.compat import metadata; assert metadata.version('certbot').startswith('4.'); assert metadata.version('acme').startswith('4.'); print('Host Certbot:', metadata.version('certbot'))"
    certbot5: python -c "from certbot_dns_alias.compat import metadata; assert metadata.version('certbot').startswith('5.'); assert metadata.version('acme').startswith('5.'); print('Host Certbot:', metadata.version('certbot'))"
    python -c "from pathlib import Path; import certbot_dns_alias; from certbot_dns_alias.compat import DNSAuthenticator, metadata; plugins = [p for p in metadata.entry_points(group='certbot.plugins') if p.name == 'dns-alias']; assert len(plugins) == 1; assert issubclass(plugins[0].load(), DNSAuthenticator); assert Path(r'{tox_root}/certbot_dns_alias') not in Path(certbot_dns_alias.__file__).resolve().parents; print('Installed wheel:', metadata.version('certbot-dns-alias'))"
commands =
    python -m pytest --import-mode=importlib {posargs:{tox_root}/tests}
    certbot plugins --text --config-dir {env_tmp_dir}/config --work-dir {env_tmp_dir}/work --logs-dir {env_tmp_dir}/logs
