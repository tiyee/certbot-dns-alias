name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest --cov=certbot_dns_alias --cov-report=term-missing
      - name: Check Certbot discovery
        run: uv run --no-sync certbot plugins --text
      - name: Check release version
        if: ${{ github.event_name == 'release' && matrix.python == '3.13' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-sync python - <<'PY'
          import tomllib
          from pathlib import Path
          from certbot.compat import os
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must be v{version}")
          PY
      - run: uv run --no-sync python scripts/build_distributions.py
      - run: uv run --no-sync twine check --strict dist/alias/* dist/delegation/*
      - name: Save release distributions
        if: ${{ github.event_name == 'release' && matrix.python == '3.13' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: distributions
          path: |
            dist/alias/*
            dist/delegation/*

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            tox-env: py39-certbot3
          - python: "3.10"
            tox-env: py310-certbot3
          - python: "3.11"
            tox-env: py311-certbot3
          - python: "3.12"
            tox-env: py312-certbot3
          - python: "3.13"
            tox-env: py313-certbot3
          - python: "3.10"
            tox-env: py310-certbot5
          - python: "3.11"
            tox-env: py311-certbot5
          - python: "3.12"
            tox-env: py312-certbot5
          - python: "3.13"
            tox-env: py313-certbot5
          - python: "3.14"
            tox-env: py314-certbot5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --no-sync tox run -e ${{ matrix.tox-env }}
      - name: Build both distributions
        run: uv run --no-sync python scripts/build_distributions.py
      - name: Check alias installation and removal
        run: uv run --no-sync python scripts/check_installation.py --python .tox/${{ matrix.tox-env }}/bin/python
      - name: Check clean host installation and public lifecycle
        run: uv run --no-sync python scripts/check_installation.py --fresh --python .tox/${{ matrix.tox-env }}/bin/python

  lower-bounds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise both Python boundaries of each supported host series.
        include:
          - python: "3.9"
            certbot: "3"
          - python: "3.13"
            certbot: "3"
          - python: "3.10"
            certbot: "5"
          - python: "3.14"
            certbot: "5"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/build_distributions.py
      - name: Test installed wheel at dependency lower bounds
        run: uv run --no-sync python scripts/check_lower_bounds.py --python ${{ matrix.python }} --certbot ${{ matrix.certbot }}
