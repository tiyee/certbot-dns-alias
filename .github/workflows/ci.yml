name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest --cov=certbot_dns_alias --cov-report=term-missing
      - name: Check Certbot discovery
        run: uv run --no-sync certbot plugins --text
      - run: uv build
      - run: uv run --no-sync twine check --strict dist/*

  certbot-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest
          python-version: "3.10"
      - run: uv sync --locked
      - run: uv run --with 'certbot==3.0.0' --with 'acme==3.0.0' --with 'pyopenssl<25' pytest
