name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish certbot-dns-alias
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/alias/
          skip-existing: true
      - name: Publish certbot-dns-delegation
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/delegation/
          skip-existing: true
