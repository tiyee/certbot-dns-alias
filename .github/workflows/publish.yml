name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest
          python-version: "3.13"
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must be v{version}")
          PY
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync tox run -e py313-certbot3,py313-certbot5
      - run: uv run --no-sync python scripts/build_distributions.py
      - run: uv run --no-sync twine check --strict dist/alias/* dist/delegation/*
      - name: Check alias with Certbot 3 and 5
        run: |
          uv run --no-sync python scripts/check_installation.py --python .tox/py313-certbot3/bin/python
          uv run --no-sync python scripts/check_installation.py --python .tox/py313-certbot5/bin/python
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: distributions
          path: |
            dist/alias/*
            dist/delegation/*

  publish:
    needs: build
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish certbot-dns-alias
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/alias/
          skip-existing: true
      - name: Publish certbot-dns-delegation
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/delegation/
          skip-existing: true
