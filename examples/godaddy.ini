# GoDaddy Domains v3 requires a Personal Access Token, not an API key/secret.
dns_alias_provider = godaddy
dns_alias_godaddy_api_token = YOUR_GODADDY_PAT
# Optional: skip registered-domain discovery and restrict eligible DNS zones.
dns_alias_godaddy_zones = delegate.example.net
# Optional: use separate OTE credentials for the GoDaddy test environment.
# dns_alias_godaddy_ote = true
