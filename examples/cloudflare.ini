# Copy to a private file and chmod 600. Do not commit real credentials.
dns_alias_provider = cloudflare
dns_alias_cloudflare_api_token = YOUR_API_TOKEN

# Optional: restrict eligible zones and skip zone discovery (Zone:Zone:Read).
# Replace the placeholder with the 32-character Zone ID from the Cloudflare dashboard.
# Omit this setting to discover all zones visible to the token instead.
dns_alias_cloudflare_zone_ids = delegate.example.net:0123456789abcdef0123456789abcdef
# An optional name-only list can further restrict the mapped zones; each needs an ID above.
# dns_alias_cloudflare_zones = delegate.example.net
